<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>丽珠 AI 社团 · 暗夜作品巨幕</title>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@200;300;400;500;700;900&family=Noto+Serif+SC:wght@300;500;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { width: 100%; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0d;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(255,255,255,0.2); color: #fff; }

  .film-grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  #app-loader {
    position: fixed;
    inset: 0;
    background: #0a0a0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    letter-spacing: 4px;
    font-family: 'JetBrains Mono', monospace;
    transition: opacity 0.4s ease;
  }
  #app-loader .loader-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.6;
    margin-bottom: 16px;
    animation: loaderPulse 1.4s ease-in-out infinite;
  }
  #app-loader.hidden { opacity: 0; pointer-events: none; }
  @keyframes loaderPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.8); opacity: 0.8; }
  }

  a { color: inherit; text-decoration: none; }

  /* ========= 作品上传 FAB（注入层） ========= */
  #pingce-upload-fab {
    position: fixed;
    right: 28px;
    bottom: 100px;
    z-index: 99999;
    padding: 10px 16px;
    border-radius: 24px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(8px);
    transition: transform 0.25s ease, background 0.25s ease;
    font-family: 'Noto Sans SC', sans-serif;
    text-decoration: none;
  }
  #pingce-upload-fab:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.14);
    color: #fff;
  }

  #pingce-admin-fab {
    position: fixed;
    right: 28px;
    bottom: 152px;
    z-index: 99999;
    padding: 9px 16px;
    border-radius: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
    font-family: 'Noto Sans SC', sans-serif;
    text-decoration: none;
  }
  #pingce-admin-fab:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  /* ========= 登录 / 个人中心入口 ========= */
  #pingce-login-fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 99999;
    padding: 9px 16px;
    border-radius: 24px;
    background: linear-gradient(135deg, #2568d8 0%, #173f8f 100%);
    border: none;
    color: #fff;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(37, 104, 216, 0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    font-family: 'Noto Sans SC', sans-serif;
    text-decoration: none;
  }
  #pingce-login-fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(37, 104, 216, 0.55);
  }
  #pingce-login-fab.member {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: none;
    color: rgba(255,255,255,0.85);
  }
  #pingce-login-fab.member:hover { background: rgba(255,255,255,0.14); color: #fff; }

  /* ========= 报名 Modal CSS removed — 使用独立登录页 ========== */

  @media (max-width: 600px) {
    #pingce-login-fab { right: 16px; bottom: 16px; }
    #pingce-upload-fab, #pingce-admin-fab { right: 16px; }
  }
</style>
</head>
<body>
<div id="app-loader"><div class="loader-dot"></div>LOADING…</div>
<div class="film-grain"></div>
<div id="root"></div>

<!-- 作品上传入口 -->
<a id="pingce-upload-fab" href="/upload.html" title="上传作品" role="link">+ 上传作品</a>

<!-- 管理后台入口 -->
<a id="pingce-admin-fab" href="/admin.html" title="管理后台" role="link">管理后台</a>

<!-- 登录 / 个人中心入口 -->
<a id="pingce-login-fab" href="/login.html" title="登录 / 个人中心" role="link">登录</a>

<script src="app.js"></script>
<script>
  // ===== 登录态：未登录显示「登录」，已登录显示「个人中心」 =====
  (function () {
    var fab = document.getElementById('pingce-login-fab');
    if (!fab) return;
    fetch('/api/auth/me').then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.authenticated) {
        fab.href = '/my.html';
        fab.className = 'member';
        fab.textContent = '个人中心';
        fab.title = '进入我的中心';
      }
      // 未登录保持默认「登录」，href 已指向 /login.html
    }).catch(function () {});
  })();
</script>
</body>
</html>
